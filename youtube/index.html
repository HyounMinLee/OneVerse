  }

  /* ---------- 폴더 내부 ---------- */
  function renderFolder(view){
    const fid = nav.folder;
    const all = linksIn(fid);
    if(query){ renderSearchResults(view, all, false); return; }
    if(!all.length){
      view.append(el("div", { class:"empty" },
        el("div", { class:"art", html:ICON.folder }),
        el("h2", null, "이 폴더는 비어 있어요"),
        el("p", null, "유튜브에서 ‘공유 → 링크 복사’ 후 아래 버튼을 누르면 커버 이미지와 제목이 자동으로 등록됩니다."),
        el("button", { class:"btn primary", type:"button", onclick:() => openLinkSheet() }, "이 폴더에 링크 추가")
      ));
    } else {
      const grid = el("section", { class:"grid" });
      sortLinks(all.slice()).forEach((l, i) => grid.append(linkCard(l, i, false)));
      view.append(grid);
    }
    view.append(el("div", { class:"swipe-hint", html:ICON.swipe + "<span>옆으로 밀면 폴더 목록으로 돌아갑니다</span>" }));
  }

  function renderSearchResults(view, pool, showFolder){
    const q = query.toLowerCase();
    const list = sortLinks(pool.filter(l =>
      (l.title || "").toLowerCase().includes(q) || (l.author || "").toLowerCase().includes(q) ||
      (showFolder && (visOf(l.folderId).name || "").toLowerCase().includes(q))).slice());

    if(!list.length){
      view.append(el("div", { class:"empty" }, el("div", { class:"art", html:ICON.search }),
        el("h2", null, "검색 결과가 없어요"), el("p", { style:"margin-bottom:0" }, "다른 단어로 검색해 보세요.")));
      return;
    }
    const grid = el("section", { class:"grid" });
    list.forEach((l, i) => grid.append(linkCard(l, i, showFolder)));
    view.append(grid);
  }

  function linkCard(l, i, showFolder){
    const img = el("img", { alt:"", loading:"lazy" });
    loadThumb(img, l.videoId);
    const v = visOf(l.folderId);
    return el("article", { class:"card", style:`animation-delay:${Math.min(i, 12) * 25}ms` },
      el("div", { class:"thumb", role:"link", tabindex:"0", "aria-label":`${l.title || "영상"} 재생`,
          onclick:() => { if(!swipe.moved) openLink(l); }, onkeydown:(e) => { if(e.key === "Enter") openLink(l); } },
        img,
        l.isShort ? el("span", { class:"tag" }, "Shorts") : (l.start ? el("span", { class:"tag" }, fmtTime(l.start) + "부터") : null),
        showFolder ? el("span", { class:"tag folder", html:folderBadge(v) + `<span>${esc(v.name)}</span>` }) : null,
        el("span", { class:"playbtn", html:ICON.play })
      ),
      el("div", { class:"meta" },
        el("div", { class:"txt" },
          el("h3", { html:highlight(l.title || "제목 없음", query) }),
          el("div", { class:"sub" }, l.author ? el("b", { html:highlight(l.author, query) }) : null, l.author ? "·" : null, rel(l.createdAt))
        ),
        el("button", { class:"more", type:"button", "aria-label":"메뉴", onclick:() => openLinkMenu(l.id), html:ICON.more })
      )
    );
  }
  function fmtTime(s){ const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; }

  /** 원격 모드에서 아직 데이터가 없을 때(불러오는 중·실패) 안내 카드. 표시했으면 true */
  function renderRemoteState(view){
    if(!useRemote() || isLocked() || remote.data) return false;
    if(remote.error){
      view.append(el("div", { class:"empty" },
        el("div", { class:"art", html:ICON.folder }),
        el("h2", null, "링크를 불러오지 못했어요"),
        el("p", null, remote.error),
        el("button", { class:"btn primary", type:"button", onclick:() => { remote.error = ""; render(); pull(true); } }, "다시 시도")
      ));
      return true;
    }
    if(!remote.fresh){
      view.append(el("div", { class:"empty" },
        el("div", { class:"art", html:ICON.folder }),
        el("h2", null, "불러오는 중…"),
        el("p", { style:"margin-bottom:0" }, "GitHub에서 암호화된 링크를 가져와 복호화하고 있습니다.")
      ));
      return true;
    }
    return false;
  }

  function render(anim){
    if(nav.view === "folder" && !waitingForData() && !validFolder(nav.folder)){ nav.view = "home"; nav.folder = null; }
    renderChrome();
    const view = $("#view"); view.textContent = "";
    if(renderRemoteState(view)){ /* 안내 카드만 표시 */ }
    else if(nav.view === "home") renderHome(view); else renderFolder(view);
    const page = $("#page");
    page.style.transition = ""; page.style.transform = ""; page.style.opacity = "";
    page.classList.remove("enter-fwd", "enter-back");
    if(anim){ void page.offsetWidth; page.classList.add(anim === "fwd" ? "enter-fwd" : "enter-back"); }
  }
  function renderResults(){
    const view = $("#view"); view.textContent = "";
    if(renderRemoteState(view)) return;
    if(nav.view === "home") renderHome(view); else renderFolder(view);
  }

  /* ================= 내비게이션 (기기 뒤로가기 연동) ================= */
  const hashOf = fid => "#folder-" + (fid === NONE ? "none" : fid);
  function fidFromHash(){
    const m = /^#folder-([\w-]+)$/.exec(location.hash || "");
    if(!m) return null;
    return m[1] === "none" ? NONE : m[1];
  }
  function clearSearch(){ query = ""; $("#search").value = ""; $("#searchBox").classList.remove("has"); }
  function openFolder(fid){
    if(!validFolder(fid)) return;
    clearSearch();
    nav.view = "folder"; nav.folder = fid;
    try{ history.pushState({ v:"folder", f:fid }, "", hashOf(fid)); }catch(e){ /* 히스토리 사용 불가 환경 */ }
    render("fwd");
    window.scrollTo(0, 0);
    if(!D().settings.hintSeen && (isAndroid || isIOS)){ D().settings.hintSeen = true; save(); setTimeout(() => toast("옆으로 밀면 폴더 목록으로 돌아갑니다"), 500); }
  }
  let pendingAnim = null;
  function goHome(anim){
    clearSearch();
    if(history.state && history.state.v === "folder"){ pendingAnim = anim || "back"; history.back(); return; }
    nav.view = "home"; nav.folder = null;
    try{ history.replaceState({ v:"home" }, "", location.pathname + location.search); }catch(e){ /* 무시 */ }
    render(anim || "back"); window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", (e) => {
    closeAll();
    const s = e.state;
    if(s && s.v === "folder" && validFolder(s.f)){ nav.view = "folder"; nav.folder = s.f; render("fwd"); }
    else { nav.view = "home"; nav.folder = null; clearSearch(); render(pendingAnim || "back"); }
    pendingAnim = null;
    window.scrollTo(0, 0);
  });

  /* ================= 스와이프로 폴더 목록 복귀 ================= */
  const swipe = { active:false, x:0, y:0, dx:0, lock:null, t:0, moved:false };
  const pageEl = $("#page");
  pageEl.addEventListener("touchstart", (e) => {
    swipe.moved = false;
    if(nav.view !== "folder" || stack.length || e.touches.length > 1){ swipe.active = false; return; }
    if(e.target.closest("input,select")){ swipe.active = false; return; }
    const t = e.touches[0];
    Object.assign(swipe, { active:true, x:t.clientX, y:t.clientY, dx:0, lock:null, t:Date.now() });
  }, { passive:true });
  pageEl.addEventListener("touchmove", (e) => {
    if(!swipe.active) return;
    const t = e.touches[0];
    const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
    if(swipe.lock === null){
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      swipe.lock = Math.abs(dx) > Math.abs(dy) * 1.2 ? "h" : "v";
    }
    if(swipe.lock !== "h") return;
    e.preventDefault();
    swipe.moved = true; swipe.dx = dx;
    pageEl.classList.remove("enter-fwd", "enter-back");
    pageEl.style.transition = "none";
    pageEl.style.transform = `translateX(${dx * 0.9}px)`;
    pageEl.style.opacity = String(1 - Math.min(Math.abs(dx) / window.innerWidth, 1) * 0.55);
  }, { passive:false });
  function endSwipe(){
    if(!swipe.active) return;
    swipe.active = false;
    if(swipe.lock !== "h") return;
    const dx = swipe.dx, dt = Math.max(1, Date.now() - swipe.t);
    const fast = Math.abs(dx) / dt > 0.45 && Math.abs(dx) > 40;
    if(Math.abs(dx) > window.innerWidth * 0.25 || fast){
      pageEl.style.transition = "transform .2s ease-out, opacity .2s ease-out";
      pageEl.style.transform = `translateX(${dx < 0 ? "-" : ""}${window.innerWidth}px)`;
      pageEl.style.opacity = "0";
      setTimeout(() => goHome("back"), 190);
    } else {
      pageEl.style.transition = "transform .28s cubic-bezier(.2,.9,.2,1), opacity .28s";
      pageEl.style.transform = ""; pageEl.style.opacity = "";
    }

  }
  pageEl.addEventListener("touchend", endSwipe);
  pageEl.addEventListener("touchcancel", endSwipe);

  function attachLongPress(node, fn){
    let t = null, fired = false;
    node.addEventListener("touchstart", () => { fired = false; t = setTimeout(() => { fired = true; fn(); try{ if(navigator.vibrate) navigator.vibrate(10); }catch(e){ /* 무시 */ } }, 520); }, { passive:true });
    const cancel = () => clearTimeout(t);
    node.addEventListener("touchend", (e) => { cancel(); if(fired) e.preventDefault(); });
    node.addEventListener("touchmove", cancel, { passive:true });
    node.addEventListener("contextmenu", (e) => { e.preventDefault(); fn(); });
  }

  /* ================= 시트 공통 ================= */
  const stack = [];
  function openSheet(id){
    const s = document.getElementById(id);
    /* 시트 위에 시트를 열 때(설정 → 확인 등) 나중에 연 시트가 항상 위에 오도록 */
    s.style.zIndex = String(70 + stack.length);
    stack.push(s);
    $("#scrim").classList.add("show");
    requestAnimationFrame(() => s.classList.add("show"));
  }
  function closeSheet(){
    const s = stack.pop(); if(s) s.classList.remove("show");
    if(!stack.length) $("#scrim").classList.remove("show");
  }
  function closeAll(){ while(stack.length) closeSheet(); }
  $("#scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){ if(stack.length) closeSheet(); else if(nav.view === "folder") goHome("back"); }
  });
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
  document.querySelectorAll(".sheet").forEach(sh => {
    sh.prepend(el("button", { class:"sheet-x", type:"button", "aria-label":"닫기", onclick:closeSheet,
      html:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>' }));
    const grab = sh.querySelector(".grab");
    if(grab) grab.after(el("div", { class:"swipe-tip", html:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7 4 11l4 4M16 7l4 4-4 4M4 11h16"/></svg>옆으로 밀면 닫힙니다' }));
  });

  /* ---------- 시트 가로 스와이프로 닫기 (설정 등 모든 시트 공통) ---------- */
  const ssw = { active:false, sheet:null, x:0, y:0, dx:0, lock:null, t:0 };
  function sheetReset(sh, animate){
    sh.style.transition = animate ? "transform .26s cubic-bezier(.2,.9,.2,1), opacity .26s" : "";
    sh.style.setProperty("--sx", "0px");
    sh.style.opacity = "";
    if(animate) setTimeout(() => { sh.style.transition = ""; }, 280);
  }
  document.addEventListener("touchstart", (e) => {
    ssw.active = false;
    if(!stack.length || e.touches.length > 1) return;
    const sh = stack[stack.length - 1];
    if(!sh.contains(e.target)) return;
    if(e.target.closest("input,textarea,select")) return;
    const t = e.touches[0];

  }, { passive:true });
  document.addEventListener("touchmove", (e) => {
    if(!ssw.active) return;
    const t = e.touches[0];
    const dx = t.clientX - ssw.x, dy = t.clientY - ssw.y;
    if(ssw.lock === null){
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      ssw.lock = Math.abs(dx) > Math.abs(dy) * 1.2 ? "h" : "v";
    }
    if(ssw.lock !== "h") return;
    e.preventDefault();
    ssw.dx = dx;
    ssw.sheet.style.transition = "none";
    ssw.sheet.style.setProperty("--sx", `${dx}px`);
    ssw.sheet.style.opacity = String(1 - Math.min(Math.abs(dx) / window.innerWidth, 1) * 0.5);
  }, { passive:false });
  function endSheetSwipe(){
    if(!ssw.active) return;
    ssw.active = false;
    if(ssw.lock !== "h") return;
    const sh = ssw.sheet, dx = ssw.dx, dt = Math.max(1, Date.now() - ssw.t);
    const fast = Math.abs(dx) / dt > 0.45 && Math.abs(dx) > 40;
    if(Math.abs(dx) > window.innerWidth * 0.22 || fast){
      sh.style.transition = "transform .2s ease-out, opacity .2s ease-out";
      sh.style.setProperty("--sx", `${dx < 0 ? "-" : ""}${window.innerWidth}px`);
      sh.style.opacity = "0";
      setTimeout(() => {
        sh.style.transition = "none";
        if(stack[stack.length - 1] === sh) closeSheet();
        requestAnimationFrame(() => { sh.style.setProperty("--sx", "0px"); sh.style.opacity = ""; requestAnimationFrame(() => { sh.style.transition = ""; }); });
      }, 190);
    } else sheetReset(sh, true);
  }

    if(beforeKey !== repoKey()){ loadVaultCache(); resetRemote(); hideLock(); applyMode(); render(); }
    if(!hasRepo()){ setNote("#ghStatus", "소유자와 저장소를 입력하세요", true); renderEncSection(); return; }
    if(!cfg.token){ setNote("#ghStatus", "토큰 없이 읽기 전용으로 저장했습니다", true); renderEncSection(); refreshAfterConnect(); return; }
    btn.disabled = true;
    setNote("#ghStatus", "연결 확인 중…", false);
    try{
      const rr = await gh("GET", repoApi());
      if(!rr.ok) throw await apiError(rr);
      const repo = await rr.json();
      if(repo.permissions && repo.permissions.push === false) throw new Error("토큰에 이 저장소의 쓰기 권한이 없어요");
      const br = await gh("GET", `${repoApi()}/branches/${encodeURIComponent(cfg.branch)}`);
      if(!br.ok) throw await apiError(br);
      setNote("#ghStatus", `연결됨 · ${cfg.owner}/${cfg.repo} (${cfg.branch})${repo.private ? " · 비공개 저장소" : " · 공개 저장소(내용은 암호문으로만 공개)"}`, false);
      toast("GitHub에 연결했습니다.");
      remote.fresh = false;
      renderEncSection();
      refreshAfterConnect();
    }catch(e){
      console.error("연결 확인 실패", e);
      setNote("#ghStatus", e.message, true);
    }finally{
      btn.disabled = false;
    }
  });

  function refreshAfterConnect(){
    ensureVault().catch((e) => { console.warn("암호 설정 확인 실패", e); return false; }).then((changed) => {
      renderEncSection();
      if(changed) onVaultChanged(); else resumeVault();
    });
  }

  $("#ghClear").addEventListener("click", () => {
    if(!cfg.token) return;
    if(cfg.sharedName){ toast(`${cfg.sharedName}의 토큰입니다. 그 앱에서 지워 주세요.`); return; }
    confirmDialog("토큰을 지울까요?", "이 기기에서 튜브폴더 토큰만 지웁니다. GitHub에 저장된 암호화 링크는 그대로 남습니다.", [
      { label:"취소" },
      { label:"지우기", kind:"danger", run:() => {
        cfg.token = "";
        saveConfig(false);
        loadConfig();
        remote.fresh = false;
        renderGhSection(); renderEncSection(); render();
        pull(true);
      } }
    ]);
  });

  /* ================= 암호화 설정 ================= */
  function renderEncSection(){
    $("#stDesc").textContent = useRemote()
      ? "폴더와 링크는 암호화되어 GitHub에 저장됩니다. 이 기기에는 암호문만 남고, 화면 설정만 이 브라우저에 저장됩니다."
      : "데이터는 이 브라우저에만 저장됩니다. GitHub를 연결하고 암호화를 켜면 암호화되어 업로드됩니다.";
    const on = !!vault.meta && hasRepo();
    if(!canWrite()) setNote("#encStatus", `${on ? "켜짐" : "꺼짐"} · GitHub 토큰을 연결해야 바꿀 수 있습니다`, !on);
    else if(!on) setNote("#encStatus", "꺼짐 · 암호를 정하면 이 기기의 폴더·링크가 AES-256-GCM으로 암호화되어 업로드됩니다", true);
    else setNote("#encStatus", "켜짐 · AES-256-GCM으로 암호화되어 커밋됩니다. 커밋 메시지에도 제목·채널을 남기지 않습니다", false);
    $("#encApply").textContent = on ? "암호 변경" : "암호화 켜고 업로드";
    $("#encForm").hidden = !(canWrite() && !isLocked());
  }

  $("#encApply").addEventListener("click", () => {
    const pw1 = $("#encPw1").value, pw2 = $("#encPw2").value;
    if(pw1.length < MIN_PASSWORD){ setNote("#encStatus", `암호는 ${MIN_PASSWORD}자 이상이어야 합니다`, true); $("#encPw1").focus(); return; }
    if(pw1 !== pw2){ setNote("#encStatus", "두 암호가 서로 다릅니다", true); $("#encPw2").focus(); return; }
    const enable = !vault.meta;
    confirmDialog(enable ? "암호화를 켤까요?" : "암호를 바꿀까요?",
      enable ? "이 기기의 폴더·링크를 암호화해 GitHub에 커밋합니다. 이후 이 브라우저에는 암호문만 남습니다. 암호를 잊으면 누구도 복구할 수 없습니다."
             : "새 암호로 링크 파일을 다시 암호화합니다. 다른 기기에서도 새 암호로 다시 열어야 합니다.",
      [{ label:"취소" }, { label:enable ? "암호화 켜기" : "암호 변경", kind:"primary", run:() => applyEncryption(pw1, enable) }]);
  });

  async function applyEncryption(pw, enable){
    const btn = $("#encApply");
    btn.disabled = true;
    setNote("#encStatus", enable ? "암호화하는 중… 화면을 닫지 마세요" : "새 암호로 바꾸는 중… 화면을 닫지 마세요", false);
    try{
      if(await ensureVault()){ onVaultChanged(); throw new Error("다른 기기에서 암호 설정이 바뀌었어요. 다시 시도해 주세요"); }
      if(isLocked()) throw new Error("잠금을 먼저 풀어 주세요");
      const nv = await createVault(pw);
      const data = await rewriteAll(nv.meta, nv.key, enable ? "튜브폴더 암호화 적용" : "튜브폴더 암호 변경");
      await forgetKeys();
      /* 업로드가 끝난 이전 로컬 평문 데이터는 지움 */
      mem.legacy = { folders:[], links:[] };
      applyMode();
      save();
      $("#encPw1").value = ""; $("#encPw2").value = "";
      renderGhSection(); renderEncSection(); render();
      toast(enable ? `폴더 ${data.folders.length}개, 영상 ${data.links.length}개를 암호화해 올렸습니다.` : "새 암호로 바꿨습니다.");
      pull(true);
    }catch(e){
      console.error("암호화 설정 실패", e);
      setNote("#encStatus", e.message, true);
    }finally{
      btn.disabled = false;
    }
  }

  /* ================= 잠금 화면 ================= */
  function showLock(){
    const lk = $("#lock");
    if(lk.classList.contains("on")) return;
    closeAll();
    lk.classList.add("on");
    $("#lockErr").textContent = "";
    renderChrome();
    setTimeout(() => $("#lockPw").focus(), 50);
  }
  function hideLock(){ $("#lock").classList.remove("on"); }

  /** 다른 기기에서 암호를 켜거나 바꾼 것을 감지했을 때 */
  function onVaultChanged(){
    resetRemote();
    resumeVault();
  }
  /** 기억된 키로 잠금 해제를 시도한 뒤, 잠겨 있으면 잠금 화면 · 아니면 원격 데이터를 다시 읽음 */
  function resumeVault(){
    return tryRememberedKey().then(decryptCached).then(() => {
      applyMode(); render();
      if(isLocked()){ showLock(); return; }
      hideLock();
      pull(true).then(migrateLegacy);
    });
  }

  $("#lockForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = $("#lockPw").value, err = $("#lockErr"), btn = $("#lockOpen");
    if(!pw){ $("#lockPw").focus(); return; }
    btn.disabled = true; err.textContent = ""; btn.textContent = "확인 중…";
    try{
      if(!vault.checked && hasRepo()){
        try{ if(await ensureVault()) resetRemote(); }catch(er){ console.warn("암호 설정 확인 실패, 이 기기에 저장된 설정으로 진행", er); }
      }
      if(!vault.meta){ hideLock(); applyMode(); render(); return; }
      const key = await deriveKey(pw, vault.meta);
      if(!await verifyKey(key, vault.meta)){
        err.textContent = "암호가 맞지 않습니다";
        const card = $("#lockForm");
        card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
        $("#lockPw").select();
        return;
      }
      vault.key = key;
      if($("#lockRemember").checked){
        try{ await rememberKey(key); }catch(er){ console.warn("키 기억 실패", er); toast("이 브라우저에서는 기억하기를 쓸 수 없습니다."); }
      }
      $("#lockPw").value = "";
      hideLock();
      await decryptCached();
      applyMode();
      render();
      pull(true).then(migrateLegacy);
    }catch(er){
      console.error("잠금 해제 실패", er);
      err.textContent = er.message;
    }finally{
      btn.disabled = false; btn.textContent = "열기";
    }
  });
  $("#lockSettings").addEventListener("click", openSettings);

  $("#lockBtn").addEventListener("click", async () => {
    vault.key = null;
    await forgetKeys();
    remote.data = null;
    remote.fresh = false;
    applyMode();
    closeAll();
    render();
    showLock();
  });
  $("#appToggleRow").addEventListener("click", () => { D().settings.openInApp = !D().settings.openInApp; save(); $("#appToggle").classList.toggle("on", D().settings.openInApp); });
  function backupJson(){ return JSON.stringify({ version:3, exportedAt:new Date().toISOString(), folders:D().folders, links:D().links }, null, 2); }
  $("#exportBtn").addEventListener("click", () => {
    try{
      const blob = new Blob([backupJson()], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const d = new Date();
      const name = `tubefolder-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
      const a = el("a", { href:url, download:name }); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("백업 파일을 저장했습니다.");
    }catch(e){ toast("파일 저장이 막혀 있습니다. ‘백업 데이터 복사’를 이용해 주세요."); }
  });
  $("#copyBackupBtn").addEventListener("click", () => copyText(backupJson(), "백업 데이터를 복사했습니다."));
  $("#importBtn").addEventListener("click", () => { const b = $("#importBox"); b.hidden = !b.hidden; });
  $("#importFile").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0]; if(!file) return;
    try{ $("#importText").value = await file.text(); $("#importHint").textContent = `‘${file.name}’을(를) 읽었습니다. 복원하기를 누르세요.`; $("#importHint").className = "hint ok"; }
    catch(err){ $("#importHint").textContent = "파일을 읽지 못했습니다."; $("#importHint").className = "hint err"; }
    e.target.value = "";
  });
  $("#importApply").addEventListener("click", () => {
    let obj;
    try{ obj = JSON.parse($("#importText").value); }
    catch(e){ $("#importHint").textContent = "JSON 형식이 올바르지 않습니다."; $("#importHint").className = "hint err"; return; }
    const incoming = normalize(obj);
    if(!incoming.folders.length && !incoming.links.length){ $("#importHint").textContent = "복원할 폴더나 링크가 없습니다."; $("#importHint").className = "hint err"; return; }
    const src = { folders:incoming.folders, links:incoming.links };
    const apply = (mode) => {
      const ok = mutate(mode === "replace"
        ? (d) => { d.folders = clone(src.folders); d.links = clone(src.links); }
        : (d) => mergeInto(d, src));
      if(!ok) return;
      closeAll(); render(); toast("복원했습니다.");
    };
    confirmDialog("백업을 복원할까요?", `폴더 ${incoming.folders.length}개, 영상 ${incoming.links.length}개를 찾았습니다.`, [
      { label:"기존 데이터에 합치기", kind:"primary", run:() => apply("merge") },
      { label:"기존 데이터를 지우고 덮어쓰기", kind:"danger", run:() => apply("replace") },
      { label:"취소" }
    ]);
  });

  /* ================= 검색·정렬 ================= */
  const search = $("#search");
  let sDeb = null;
  search.addEventListener("input", () => {
    $("#searchBox").classList.toggle("has", !!search.value);
    clearTimeout(sDeb); sDeb = setTimeout(() => { query = search.value.trim(); renderResults(); }, 120);
  });
  $("#searchClear").addEventListener("click", () => { clearSearch(); renderResults(); search.focus(); });
  $("#sortSel").addEventListener("change", (e) => { D().settings.sort = e.target.value; save(); renderResults(); });

  $("#fab").addEventListener("click", () => openLinkSheet());

  /* ================= 공유 수신 (PWA share_target) ================= */
  function handleIncoming(){
    try{
      const sp = new URLSearchParams(location.search);
      const shared = sp.get("url") || sp.get("text") || "";
      if(shared && parseYouTube(shared)){
        history.replaceState({ v:"home" }, "", location.pathname);
        openLinkSheet(); urlInput.value = shared; onUrlChange();
      }
    }catch(e){ /* 무시 */ }
  }

  /* ================= 시작 ================= */
  async function start(){
    loadConfig();
    loadVaultCache();
    hydrateRemote();
    if(vault.meta) await tryRememberedKey();
    await decryptCached();
    load();
    applyDisplay();
    (function initRoute(){
      const fid = fidFromHash();
      /* 원격 데이터를 아직 못 읽은 경우에도 폴더 주소는 유지 (불러온 뒤 render에서 다시 검증) */
      const okFid = fid && (validFolder(fid) || waitingForData());
      try{
        history.replaceState({ v:"home" }, "", location.pathname + location.search);
        if(okFid){ history.pushState({ v:"folder", f:fid }, "", hashOf(fid)); nav.view = "folder"; nav.folder = fid; }
      }catch(e){ if(okFid){ nav.view = "folder"; nav.folder = fid; } }
    })();
    render();
    if(isLocked()) showLock(); else handleIncoming();
    if(hasRepo()){
      try{ if(await ensureVault()){ onVaultChanged(); return; } }
      catch(e){ console.warn("암호 설정 확인 실패, 이 기기에 저장된 설정으로 진행", e); }
    }
    if(useRemote() && !isLocked()){ await pull(false); migrateLegacy(); }
  }
  start();
  window.addEventListener("scroll", () => { $("#topbar").classList.toggle("scrolled", window.scrollY > 8); $("#topbar").classList.toggle("titled", window.scrollY > 70); }, { passive:true });
  window.addEventListener("storage", (e) => {
    if(e.key === STORE_KEY){ load(); applyDisplay(); render(); }
    else if(e.key === GH_KEY || SHARED_GH.some(s => s.key === e.key)){ loadConfig(); render(); }
  });
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible" && !pendingWrites && useRemote() && !isLocked()) pull(false);
  });
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").catch(() => { /* 오프라인 캐시는 선택 사항 */ });
  }
})();
</script>
</body>
</html>
