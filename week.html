<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="주간 말씀">
<title>주간 말씀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* 색상·글꼴은 오늘의 말씀(index.html)과 동일 */
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efede7; --text:#1b1a18; --muted:#7d7a74; --faint:#b8b5ae; --line:#e7e4dd;
  --accent:#2f7366; --accent-2:#48998a; --accent-ink:#ffffff; --accent-soft:#e1efeb;
  --danger:#d4553f;
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.42);
  --shadow:0 1px 2px rgba(30,25,20,.04),0 12px 32px rgba(30,25,20,.07);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111214; --surface:#1a1b1e; --surface-2:#25262a; --text:#f2f1ec; --muted:#9d9ba3; --faint:#55565c; --line:#2d2e33;
    --accent:#6cc3b2; --accent-2:#4fa898; --accent-ink:#0e1d1a; --accent-soft:#1d332f;
    --danger:#ef7a66;
    --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.05);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.28);
  }
}
/* 주별 팔레트: body style에 --pa/--pb/--pacc(라이트), --pda/--pdb/--pdacc(다크) */
.pal{--ga:var(--pa,#d6f0ed);--gb:var(--pb,#bbe2dc);--gacc:var(--pacc,#2b7970)}
@media (prefers-color-scheme: dark){.pal{--ga:var(--pda,#1a2f2d);--gb:var(--pdb,#172826);--gacc:var(--pdacc,#8ad5cb)}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.01em;overscroll-behavior-x:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* 배경 그래픽 */
.blob{position:fixed;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(64px);transition:background-color .9s ease}
.blob.b1{width:85vw;height:85vw;max-width:560px;max-height:560px;top:-34vw;right:-28vw;background-color:var(--gb);opacity:.75}
.blob.b2{width:65vw;height:65vw;max-width:420px;max-height:420px;top:22vh;left:-38vw;background-color:var(--ga);opacity:.6}
@media (min-width:600px){.blob.b1{top:-240px;right:calc(50% - 560px)}.blob.b2{left:calc(50% - 560px)}}
@media (prefers-color-scheme: dark){.blob.b1{opacity:.55}.blob.b2{opacity:.4}}

.app{max-width:560px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}

/* 상단 */
.brand-row{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 4px 0}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:750;letter-spacing:-.02em}
.brand-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#48998a,#255750);color:#fff;box-shadow:0 4px 10px rgba(47,115,102,.25)}
.brand-ic svg{width:17px;height:17px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--text);text-decoration:none;background:var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--shadow);border:1px solid var(--glass-2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--bg);display:none}
.icon-btn .dot.on{display:block}
.sync{display:none;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:var(--glass);font-size:12px;font-weight:650;color:var(--muted)}
.sync.on{display:inline-flex}
.sync i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.sync.err{color:var(--danger)}
.sync.err i{animation:none;border-color:currentColor}
@keyframes spin{to{transform:rotate(360deg)}}

.week-nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;margin:0 -16px;padding:calc(8px + env(safe-area-inset-top)) 12px 10px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.wn-title{display:flex;flex-direction:column;align-items:center}
.wn-title b{font-size:26px;font-weight:780;letter-spacing:-.035em;line-height:1.2}
.wn-title span{font-size:12px;font-weight:650;color:var(--muted)}
.wn-title span em{font-style:normal;color:var(--accent)}
.nav-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--glass);border:1px solid var(--glass-2);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.nav-btn:active{transform:scale(.94)}
.nav-btn svg{width:18px;height:18px}

/* 스와이프 영역 */
.viewport{overflow:hidden;touch-action:pan-y;margin:0 -16px;padding:0 16px;min-height:60vh}
.pane{will-change:transform}
.pane.anim{transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .24s ease}
.swipe-hint{display:flex;justify-content:center;gap:5px;margin:2px 0 12px}
.swipe-hint i{width:5px;height:5px;border-radius:50%;background:var(--faint);opacity:.6}
.swipe-hint i.on{width:16px;border-radius:3px;background:var(--gacc);opacity:1}

/* 말씀 카드: 구성은 첨부 화면, 색은 오늘의 말씀 카드 */
.cards{display:flex;flex-direction:column;gap:14px}
.vcard{position:relative;overflow:hidden;isolation:isolate;padding:22px 22px 18px;border-radius:30px;
  background:linear-gradient(155deg,var(--ga) 0%,var(--gb) 100%);box-shadow:var(--shadow);
  border:1.5px solid color-mix(in srgb,var(--gacc) 30%,transparent)}
.vcard::before{content:'';position:absolute;z-index:-1;width:240px;height:240px;right:-70px;top:-90px;border-radius:50%;background:#fff;opacity:.55;filter:blur(34px)}
@media (prefers-color-scheme: dark){.vcard::before{background:var(--gacc);opacity:.12}}
.vc-head{display:flex;align-items:center;gap:10px}
.vc-title{display:block;flex:1;min-width:0;font-size:16px;font-weight:750;letter-spacing:-.03em;text-align:left;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc-fold{flex:0 0 32px;width:32px;height:32px;margin-right:-6px;display:grid;place-items:center;border-radius:50%;color:var(--gacc)}
.vc-fold:active{background:var(--glass)}
.vc-fold svg{width:20px;height:20px;transition:transform .2s}
.vcard.folded .vc-fold svg{transform:rotate(180deg)}
.vc-ref{display:inline-flex;max-width:100%;margin:10px 0 0;padding:6px 13px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:14px;font-weight:750;color:var(--gacc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc-body{margin-top:18px}
.vcard.folded .vc-body{display:none}
.vc-text{margin:0 2px;font-family:var(--serif);font-size:var(--vfs,20px);line-height:1.85;letter-spacing:-.025em;word-break:keep-all;overflow-wrap:anywhere;cursor:default}
.vc-text.masked{cursor:pointer}
.vc-text .bl{color:transparent;background:color-mix(in srgb,var(--gacc) 18%,transparent);border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:color .15s,background-color .15s}
.vc-text.peek .bl{color:var(--muted);background:transparent}
.vc-hint{margin:6px 2px 0;font-size:12px;font-weight:600;color:var(--muted);opacity:.8}
.vc-modes{display:flex;gap:8px;margin-top:20px}
.mode{flex:1 1 0;min-width:0;height:48px;border-radius:16px;border:1.5px solid transparent;background:var(--glass);font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.mode.on{border-color:var(--gacc);color:var(--gacc);background:var(--glass)}
.mode:active{transform:scale(.97)}
.vc-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:18px}
.vc-edit{flex-shrink:0;display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--glass);font-size:13px;font-weight:700}

.empty{padding:34px 20px;border-radius:30px;background:linear-gradient(180deg,color-mix(in srgb,var(--ga) 75%,var(--surface)) 0%,var(--surface) 72%);box-shadow:var(--shadow);text-align:center;color:var(--muted);font-size:14px;line-height:1.6;word-break:keep-all}
.empty b{display:block;margin-bottom:4px;font-size:18px;font-weight:780;color:var(--text)}
.notice{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:12px 14px;border-radius:18px;background:var(--glass);font-size:13px;line-height:1.5;color:var(--danger);word-break:keep-all}
.notice .btn{margin-left:auto;flex-shrink:0}
.add-row{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:14px;border-radius:16px;font-size:15px;font-weight:750;
  color:var(--accent-ink);background:linear-gradient(145deg,var(--accent-2),var(--accent));box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 30%,transparent)}
.add-row svg{width:18px;height:18px}
.add-row:active{transform:scale(.98)}
.week-stat{margin:14px 4px 0;font-size:13px;font-weight:650;color:var(--muted);text-align:center}

.skeleton{padding:28px 24px;border-radius:30px;background:var(--surface);box-shadow:var(--shadow)}
.sk-line{display:block;height:14px;border-radius:7px;background:var(--surface-2);margin:12px 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* 버튼 */
.btn{height:50px;padding:0 20px;border-radius:16px;font-size:15px;font-weight:750;letter-spacing:-.02em;background:var(--surface-2);color:var(--text)}
.btn.sm{height:34px;padding:0 12px;border-radius:11px;font-size:13px}
.btn.primary{color:var(--accent-ink);background:linear-gradient(145deg,var(--accent-2),var(--accent));box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.danger{color:var(--danger);background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}

/* 시트 */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,10,10,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;max-height:92vh;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--surface);
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grip{width:40px;height:5px;margin:0 auto 14px;border-radius:3px;background:var(--line)}
.sheet h2{margin:0 0 16px;font-size:20px;font-weight:780;letter-spacing:-.03em}
.field{display:block;margin-bottom:14px}
.field > span{display:block;margin-bottom:6px;font-size:13px;font-weight:650;color:var(--muted)}
.field input,.field textarea{width:100%;padding:13px 14px;border:1.5px solid transparent;border-radius:15px;background:var(--surface-2);font-size:16px;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none}
.field input{min-height:50px}
.field textarea{min-height:140px;resize:vertical;line-height:1.6;font-family:var(--serif)}
.field input:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.sheet-actions .btn.primary{flex:1}
.tools{display:flex;gap:8px;margin-top:12px}
.tools .btn{margin-left:auto}
.set-note{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;line-height:1.5;word-break:keep-all}
.set-note.warn{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.set-help{margin:-4px 2px 16px;font-size:12px;line-height:1.6;color:var(--muted);word-break:keep-all}

#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,12px);max-width:calc(100% - 32px);
  padding:11px 18px;border-radius:14px;background:var(--text);color:var(--bg);font-size:14px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;word-break:keep-all;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 글자 크기 조절 */
.fs-ctl{display:inline-flex;align-items:center;height:40px;padding:0 4px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-2);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.fs-ctl button{width:34px;height:32px;display:grid;place-items:center;border-radius:16px;font-weight:750;letter-spacing:-.04em;color:var(--text)}
.fs-ctl button:active:not(:disabled){background:var(--glass-2);transform:scale(.94)}
.fs-ctl button:disabled{opacity:.35;cursor:default}
.fs-ctl .fs-dn{font-size:13px}
.fs-ctl .fs-up{font-size:18px}

@media (max-width:380px){.vcard{padding:20px 16px 16px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="pal">
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<div class="app">
  <div class="brand-row">
    <div class="brand">
      <span class="brand-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M6 21h13"/><path d="M11.5 7v7M9 9.5h5"/></svg></span>
      주간 말씀
    </div>
    <div class="top-actions">
      <span class="sync" id="sync"><i></i><em id="syncText" style="font-style:normal">저장 중</em></span>
      <div class="fs-ctl" role="group" aria-label="본문 글자 크기">
        <button type="button" class="fs-dn" id="btnFontDown" aria-label="글자 작게" title="글자 작게">가</button>
        <button type="button" class="fs-up" id="btnFontUp" aria-label="글자 크게" title="글자 크게">가</button>
      </div>
      <a class="icon-btn" href="index.html" aria-label="오늘의 말씀으로 전환" title="오늘의 말씀">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17"/><path d="M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>
      </a>
      <button class="icon-btn" id="btnSettings" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <i class="dot" id="settingsDot"></i>
      </button>
    </div>
  </div>

  <nav class="week-nav">
    <button class="nav-btn" id="btnPrev" aria-label="이전 주"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="wn-title" id="btnToday" aria-label="이번 주로 이동"><b id="weekTitle"></b><span class="num" id="weekSub"></span></button>
    <button class="nav-btn" id="btnNext" aria-label="다음 주"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </nav>

  <div class="viewport" id="viewport">
    <div class="pane" id="pane"></div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>

<!-- 말씀 편집 -->
<section class="sheet" id="verseSheet" role="dialog" aria-modal="true" aria-labelledby="vsTitle">
  <div class="grip"></div>
  <h2 id="vsTitle">말씀</h2>
  <label class="field"><span>제목</span><input type="text" id="vsName" maxlength="60" autocomplete="off" placeholder="예: 예수 이름의 권세와 하나님의 형상의 완성"></label>
  <label class="field"><span>성경 구절</span><input type="text" id="vsRef" maxlength="40" autocomplete="off" placeholder="요한일서 3:2"></label>
  <label class="field"><span>본문</span><textarea id="vsText" maxlength="3000" placeholder="말씀 본문을 입력하세요"></textarea></label>
  <div class="sheet-actions">
    <button class="btn" data-close>취소</button>
    <button class="btn primary" id="vsSave">저장</button>
  </div>
  <div class="tools" id="vsTools"><button class="btn sm danger" id="vsDelete">말씀 삭제</button></div>
</section>

<!-- 설정 -->
<section class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="grip"></div>
  <h2 id="settingsTitle">GitHub 연결</h2>
  <p class="set-note" id="ghStatus"></p>
  <div class="field-row">
    <label class="field"><span>소유자 (owner)</span><input type="text" id="ghOwner" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span>저장소 (repo)</span><input type="text" id="ghRepo" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
  </div>
  <div class="field-row">
    <label class="field"><span>브랜치</span><input type="text" id="ghBranch" placeholder="main" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span>데이터 폴더</span><input type="text" id="ghPath" placeholder="data/weekly" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
  </div>
  <label class="field"><span>개인 액세스 토큰</span><input type="password" id="ghToken" placeholder="github_pat_..." autocomplete="off" spellcheck="false"></label>
  <p class="set-help" id="ghHelp"></p>
  <div class="sheet-actions">
    <button class="btn" id="ghClear">토큰 지우기</button>
    <button class="btn primary" id="ghSave">저장 및 확인</button>
  </div>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ================= 상수 ================= */
  const g_objKeys = { strConfig: 'weekly.github', strShared: 'dailyVerse.github', strLedger: 'ledger.github', strCache: 'weekly.cache.v1', strView: 'weekly.view.v1' };
  const g_strApi = 'https://api.github.com';
  const g_strDefaultSub = 'weekly';      // 성경 앱 데이터 폴더 아래 하위 폴더
  const g_nWeekStartDay = 0;            // 주의 시작 요일 (0 = 주일)
  const g_nStaleMs = 60 * 1000;
  const g_nMaxVerses = 20;
  const g_arrModes = [['full', '전체'], ['hide', '가리기']];
  // 오늘의 말씀(index.html)과 같은 팔레트 (라이트 a/b/acc, 다크 da/db/dacc)
  const g_arrPalettes = [
    { a: '#ffe6d0', b: '#ffcbb6', acc: '#b4563a', da: '#3b2620', db: '#2b1c1e', dacc: '#f2a184' },
    { a: '#e3efd8', b: '#c8dfc4', acc: '#4a7a45', da: '#1f2c1f', db: '#1a2520', dacc: '#a5d39b' },
    { a: '#dcebfb', b: '#c3d6f4', acc: '#3a62a6', da: '#1c2638', db: '#1a1f33', dacc: '#9dbcf0' },
    { a: '#ebe3fb', b: '#d5caf3', acc: '#6a50b0', da: '#2a2238', db: '#221d33', dacc: '#c3b2f2' },
    { a: '#f6ecd4', b: '#ebdab4', acc: '#8a6629', da: '#302a1d', db: '#28221a', dacc: '#e3c784' },
    { a: '#fce3e9', b: '#f3c8d4', acc: '#a8456a', da: '#36202a', db: '#2c1b25', dacc: '#f0a0bd' },
    { a: '#d6f0ed', b: '#bbe2dc', acc: '#2b7970', da: '#1a2f2d', db: '#172826', dacc: '#8ad5cb' },
  ];
  /* ================= 유틸 ================= */
  const Q = (strSel) => document.querySelector(strSel);
  const Pad = (n) => String(n).padStart(2, '0');
  const DateKeyOf = (dt) => `${dt.getFullYear()}-${Pad(dt.getMonth() + 1)}-${Pad(dt.getDate())}`;
  const ParseDateKey = (strKey) => { const [nY, nM, nD] = strKey.split('-').map(Number); return new Date(nY, nM - 1, nD); };
  const IsDateKey = (str) => typeof str === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(str) && DateKeyOf(ParseDateKey(str)) === str;
  const WeekKeyOf = (dt) => DateKeyOf(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - ((dt.getDay() - g_nWeekStartDay + 7) % 7)));
  const IsWeekKey = (str) => IsDateKey(str) && WeekKeyOf(ParseDateKey(str)) === str;
  const AddWeek = (strWk, nDelta) => { const dt = ParseDateKey(strWk); return DateKeyOf(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + nDelta * 7)); };
  const WeekEnd = (strWk) => { const dt = ParseDateKey(strWk); return DateKeyOf(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + 6)); };
  const CurrentWeekKey = () => WeekKeyOf(new Date());
  const DotDate = (strKey) => strKey.replace(/-/g, '.');
  const Esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const NewId = () => `v${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const Clone = (obj) => JSON.parse(JSON.stringify(obj));

  function B64Encode(strText) {
    const arrBytes = new TextEncoder().encode(strText);
    let strBin = '';
    for (let i = 0; i < arrBytes.length; i += 0x8000) strBin += String.fromCharCode.apply(null, arrBytes.subarray(i, i + 0x8000));
    return btoa(strBin);
  }
  function B64Decode(strB64) {
    const strBin = atob(String(strB64).replace(/\s/g, ''));
    const arrBytes = new Uint8Array(strBin.length);
    for (let i = 0; i < strBin.length; i++) arrBytes[i] = strBin.charCodeAt(i);
    return new TextDecoder().decode(arrBytes);
  }

  /* ================= 브라우저 저장소 ================= */
  const g_objLs = (() => { try { const s = window.localStorage; s.getItem('_'); return s; } catch { return null; } })();
  const g_objPref = {
    Get(strKey) { try { return g_objLs ? g_objLs.getItem(strKey) : null; } catch { return null; } },
    Set(strKey, strVal) { try { if (g_objLs) g_objLs.setItem(strKey, strVal); } catch { /* 저장 실패는 무시 */ } },
  };
  function ReadJson(strKey) { try { return JSON.parse(g_objPref.Get(strKey) || 'null'); } catch { return null; } }

  /* 본문 글자 크기 범위(px) */
  const g_nFontMin = 14;
  const g_nFontMax = 32;
  const g_nFontStep = 2;
  const g_nFontDefault = 20;
  const ClampFont = (n) => (Number.isFinite(n) ? Math.min(g_nFontMax, Math.max(g_nFontMin, Math.round(n))) : g_nFontDefault);

  /* 카드 접힘·보기 방식·글자 크기: 이 기기에서만 기억 */
  const g_objViewPref = (() => { const obj = ReadJson(g_objKeys.strView); return { objFold: (obj && obj.fold) || {}, objMode: (obj && obj.mode) || {}, nFont: ClampFont(obj && Number(obj.fs)) }; })();
  const SaveViewPref = () => g_objPref.Set(g_objKeys.strView, JSON.stringify({ fold: g_objViewPref.objFold, mode: g_objViewPref.objMode, fs: g_objViewPref.nFont }));

  /** 본문 글자 크기를 CSS 변수로 적용 (다시 그리지 않아도 즉시 반영) */
  function ApplyFontSize() {
    document.documentElement.style.setProperty('--vfs', `${g_objViewPref.nFont}px`);
    const elDn = document.getElementById('btnFontDown');
    const elUp = document.getElementById('btnFontUp');
    if (elDn) elDn.disabled = g_objViewPref.nFont <= g_nFontMin;
    if (elUp) elUp.disabled = g_objViewPref.nFont >= g_nFontMax;
  }
  function ChangeFontSize(nDelta) {
    const nNext = ClampFont(g_objViewPref.nFont + nDelta);
    if (nNext === g_objViewPref.nFont) return;
    g_objViewPref.nFont = nNext;
    SaveViewPref();
    ApplyFontSize();
  }

  /* ================= 데이터 정규화 ================= */
  function NormalizeVerse(objRaw, strWk) {
    if (!objRaw || typeof objRaw !== 'object') return null;
    const strText = typeof objRaw.text === 'string' ? objRaw.text.trim().slice(0, 3000) : '';
    const strRef = typeof objRaw.ref === 'string' ? objRaw.ref.trim().slice(0, 40) : '';
    if (!strText && !strRef) return null;
    const strDate = IsDateKey(objRaw.date) && WeekKeyOf(ParseDateKey(objRaw.date)) === strWk ? objRaw.date : strWk;
    return {
      id: typeof objRaw.id === 'string' && objRaw.id ? objRaw.id.slice(0, 40) : NewId(),
      title: typeof objRaw.title === 'string' ? objRaw.title.trim().slice(0, 60) : '',
      date: strDate,
      ref: strRef,
      text: strText,
    };
  }

  function NormalizeWeek(objRaw, strWk) {
    const objOut = { week: strWk, verses: [] };
    if (!objRaw || typeof objRaw !== 'object') return objOut;
    const setIds = new Set();
    (Array.isArray(objRaw.verses) ? objRaw.verses : []).forEach((x) => {
      if (objOut.verses.length >= g_nMaxVerses) return;
      const objV = NormalizeVerse(x, strWk);
      if (!objV) return;
      if (setIds.has(objV.id)) objV.id = NewId();
      setIds.add(objV.id);
      objOut.verses.push(objV);
    });
    // 날짜순 정렬 (같은 날짜는 입력 순서 유지)
    objOut.verses = objOut.verses.map((v, i) => [v, i]).sort((a, b) => (a[0].date < b[0].date ? -1 : a[0].date > b[0].date ? 1 : a[1] - b[1])).map((x) => x[0]);
    if (typeof objRaw.updatedAt === 'string') objOut.updatedAt = objRaw.updatedAt;
    return objOut;
  }

  /* ================= GitHub 연결 정보 ================= */
  function DetectRepo() {
    const strHost = location.hostname;
    if (!/\.github\.io$/i.test(strHost)) return { owner: '', repo: '' };
    const strOwner = strHost.split('.')[0];
    const strSeg = location.pathname.split('/').filter(Boolean)[0];
    return { owner: strOwner, repo: strSeg && !strSeg.includes('.') ? strSeg : strHost };
  }

  const g_objConfig = { owner: '', repo: '', branch: 'main', path: `data/${g_strDefaultSub}`, token: '', strTokenFrom: '' };

  /** 주간 말씀 전용 설정 → 오늘의 말씀 → 가계부 순으로 연결 정보를 찾음 */
  function LoadConfig() {
    const objDetected = DetectRepo();
    const objOwn = ReadJson(g_objKeys.strConfig) || {};
    const objShared = ReadJson(g_objKeys.strShared) || {};
    const objLedger = ReadJson(g_objKeys.strLedger) || {};
    g_objConfig.owner = objOwn.owner || objShared.owner || objLedger.owner || objDetected.owner;
    g_objConfig.repo = objOwn.repo || objShared.repo || objLedger.repo || objDetected.repo;
    g_objConfig.branch = objOwn.branch || objShared.branch || objLedger.branch || 'main';
    g_objConfig.path = CleanPath(objOwn.path || `${String(objShared.path || 'data').trim().replace(/^\/+|\/+$/g, '') || 'data'}/${g_strDefaultSub}`);
    g_objConfig.token = objOwn.token || objShared.token || objLedger.token || '';
    g_objConfig.strTokenFrom = objOwn.token ? 'own' : (objShared.token ? 'verse' : (objLedger.token ? 'ledger' : ''));
  }

  function SaveConfig() {
    const objOwn = { owner: g_objConfig.owner, repo: g_objConfig.repo, branch: g_objConfig.branch, path: g_objConfig.path };
    if (g_objConfig.token && g_objConfig.strTokenFrom === 'own') objOwn.token = g_objConfig.token;
    g_objPref.Set(g_objKeys.strConfig, JSON.stringify(objOwn));
  }

  const CleanPath = (str) => String(str || `data/${g_strDefaultSub}`).trim().replace(/^\/+|\/+$/g, '') || `data/${g_strDefaultSub}`;
  const HasRepo = () => !!(g_objConfig.owner && g_objConfig.repo);
  const CanWrite = () => HasRepo() && !!g_objConfig.token;
  const WeekFilePath = (strWk) => `${CleanPath(g_objConfig.path)}/${strWk.slice(0, 4)}/${strWk}.json`;
  const ContentsUrl = (strPath) => `${g_strApi}/repos/${encodeURIComponent(g_objConfig.owner)}/${encodeURIComponent(g_objConfig.repo)}/contents/${strPath.split('/').map(encodeURIComponent).join('/')}`;
  const RepoKey = () => `${g_objConfig.owner}/${g_objConfig.repo}@${g_objConfig.branch}:${CleanPath(g_objConfig.path)}`;

  /** 토큰 없이 읽을 때: 성경 앱(index.html)과 같이 이 페이지 기준 상대 경로의 배포 파일 */
  function PagesFileUrl(strPath) { return `${strPath}?t=${Date.now()}`; }

  async function Gh(strMethod, strUrl, objBody) {
    try {
      return await fetch(strUrl, { method: strMethod, cache: 'no-store', headers: { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', Authorization: `Bearer ${g_objConfig.token}`, ...(objBody ? { 'Content-Type': 'application/json' } : {}) }, body: objBody ? JSON.stringify(objBody) : undefined });
    } catch (e) {
      throw new Error('네트워크에 연결할 수 없어요');
    }
  }

  async function ApiError(objRes) {
    let strMsg = '';
    try { strMsg = (await objRes.json()).message || ''; } catch { /* 본문 없음 */ }
    console.error(`GitHub API 오류 ${objRes.status}: ${strMsg}`);
    if (objRes.status === 401) return new Error('토큰이 올바르지 않거나 만료됐어요');
    if (objRes.status === 403 && objRes.headers.get('x-ratelimit-remaining') === '0') return new Error('GitHub 요청 한도를 초과했어요. 잠시 후 다시 시도하세요');
    if (objRes.status === 403) return new Error('토큰에 이 저장소의 쓰기 권한이 없어요');
    if (objRes.status === 404) return new Error('저장소나 브랜치를 찾을 수 없어요');
    if (objRes.status === 409) return new Error('다른 곳에서 동시에 수정됐어요. 다시 시도해 주세요');
    if (objRes.status === 422) return new Error('저장 요청이 거부됐어요. 잠시 후 다시 시도하세요');
    return new Error(`GitHub 오류 (${objRes.status})`);
  }

  /* ================= 주 데이터 저장소 ================= */
  const g_objStore = {
    mapWeeks: new Map(),    // 주 → { objData|null, strSha, nFetchedAt }
    setFresh: new Set(),
    mapInflight: new Map(),
    strRepo: '',

    Hydrate() {
      const objCache = ReadJson(g_objKeys.strCache);
      this.strRepo = RepoKey();
      if (!objCache || objCache.repo !== this.strRepo || !objCache.weeks) return;
      Object.entries(objCache.weeks).forEach(([strWk, objW]) => {
        if (!IsWeekKey(strWk) || !objW) return;
        this.mapWeeks.set(strWk, { objData: objW.data ? NormalizeWeek(objW.data, strWk) : null, strSha: objW.sha || null, nFetchedAt: 0 });
      });
    },

    Persist() {
      const objWeeks = {};
      this.mapWeeks.forEach((objW, strWk) => { objWeeks[strWk] = { data: objW.objData, sha: objW.strSha }; });
      g_objPref.Set(g_objKeys.strCache, JSON.stringify({ repo: RepoKey(), weeks: objWeeks }));
    },

    Reset() { this.mapWeeks.clear(); this.setFresh.clear(); this.strRepo = RepoKey(); this.Persist(); },

    Put(strWk, strSha, objData) {
      this.mapWeeks.set(strWk, { objData, strSha, nFetchedAt: Date.now() });
      this.setFresh.add(strWk);
      this.Persist();
    },

    async FetchRemote(strWk) {
      if (CanWrite()) {
        const objRes = await Gh('GET', `${ContentsUrl(WeekFilePath(strWk))}?ref=${encodeURIComponent(g_objConfig.branch)}`);
        if (objRes.status === 404) return { objData: null, strSha: null };
        if (!objRes.ok) throw await ApiError(objRes);
        const objJson = await objRes.json();
        return { objData: NormalizeWeek(JSON.parse(B64Decode(objJson.content)), strWk), strSha: objJson.sha };
      }
      if (!HasRepo()) return { objData: null, strSha: null };
      let objRes;
      try { objRes = await fetch(PagesFileUrl(WeekFilePath(strWk)), { cache: 'no-store' }); } catch { throw new Error('네트워크에 연결할 수 없어요'); }
      if (objRes.status === 404) return { objData: null, strSha: null };
      if (!objRes.ok) throw new Error(`데이터를 불러오지 못했어요 (${objRes.status})`);
      return { objData: NormalizeWeek(await objRes.json(), strWk), strSha: null };
    },

    /** 오래된 주만 원격에서 다시 읽음. 내용이 바뀌면 true */
    async Ensure(strWk, bForce) {
      const objCur = this.mapWeeks.get(strWk);
      if (!bForce && objCur && this.setFresh.has(strWk) && Date.now() - objCur.nFetchedAt < g_nStaleMs) return false;
      if (!this.mapInflight.has(strWk)) {
        const strBefore = JSON.stringify(objCur ? objCur.objData : undefined);
        const objPromise = this.FetchRemote(strWk).then((objR) => { this.Put(strWk, objR.strSha, objR.objData); return JSON.stringify(objR.objData) !== strBefore; }).finally(() => this.mapInflight.delete(strWk));
        this.mapInflight.set(strWk, objPromise);
      }
      return this.mapInflight.get(strWk);
    },

    Known(strWk) { return this.mapWeeks.has(strWk); },
    Data(strWk) { const objW = this.mapWeeks.get(strWk); return objW ? objW.objData : null; },
  };

  // 같은 브랜치에 동시 커밋하면 충돌하므로 모든 쓰기를 순차 실행
  let g_objWriteChain = Promise.resolve();
  let g_nPending = 0;

  function Serialize(fnRun) {
    g_nPending += 1;
    SetSync('저장 중', false);
    const objPromise = g_objWriteChain.then(fnRun, fnRun);
    g_objWriteChain = objPromise.catch(() => {});
    return objPromise.finally(() => { g_nPending -= 1; if (g_nPending === 0) SetSync('', false); });
  }

  /** 최신 주 파일을 읽어 fnApply로 수정 후 커밋. 충돌(409/422)이면 1회 재시도 */
  function MutateWeek(strWk, fnApply, strMessage) {
    return Serialize(async () => {
      if (!CanWrite()) throw new Error('먼저 GitHub를 연결해 주세요');
      for (let nTry = 0; nTry < 2; nTry++) {
        const objCur = await g_objStore.FetchRemote(strWk);
        const objData = objCur.objData ? Clone(objCur.objData) : NormalizeWeek(null, strWk);
        fnApply(objData);
        const objNorm = NormalizeWeek(objData, strWk);
        objNorm.updatedAt = new Date().toISOString();
        const strFile = `${JSON.stringify(objNorm, null, 2)}\n`;
        const objRes = await Gh('PUT', ContentsUrl(WeekFilePath(strWk)), { message: strMessage, content: B64Encode(strFile), branch: g_objConfig.branch, ...(objCur.strSha ? { sha: objCur.strSha } : {}) });
        if ((objRes.status === 409 || objRes.status === 422) && nTry === 0) { console.warn(`커밋 충돌로 다시 시도합니다: ${strWk}`); continue; }
        if (!objRes.ok) throw await ApiError(objRes);
        const objJson = await objRes.json();
        g_objStore.Put(strWk, objJson.content ? objJson.content.sha : null, objNorm);
        return;
      }
    });
  }

  /* ================= 상태 ================= */
  const g_objState = { strWeek: CurrentWeekKey(), objView: NormalizeWeek(null, CurrentWeekKey()), bLoading: false, strError: '' };
  const g_setPeek = new Set();          // 첫글자·가리기 상태에서 잠시 펼쳐 본 카드
  const g_objEl = {
    elPane: Q('#pane'), elViewport: Q('#viewport'), elTitle: Q('#weekTitle'), elSub: Q('#weekSub'),
    elSync: Q('#sync'), elSyncText: Q('#syncText'), elDot: Q('#settingsDot'), elBackdrop: Q('#backdrop'), elToast: Q('#toast'),
  };

  function SetSync(strText, bError) {
    if (!strText && g_nPending > 0) strText = '저장 중';
    g_objEl.elSync.classList.toggle('on', !!strText);
    g_objEl.elSync.classList.toggle('err', !!bError);
    g_objEl.elSyncText.textContent = strText;
  }

  let g_nToastTimer = 0;
  function Toast(strMsg) {
    g_objEl.elToast.textContent = strMsg;
    g_objEl.elToast.classList.add('on');
    clearTimeout(g_nToastTimer);
    g_nToastTimer = setTimeout(() => g_objEl.elToast.classList.remove('on'), 2400);
  }

  /* ================= 렌더링 ================= */
  const g_strIconChevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
  const ModeOf = (strId) => (g_objViewPref.objMode[strId] === 'hide' ? 'hide' : 'full');

  /** 오늘의 말씀과 같은 팔레트를 주마다 돌아가며 적용 */
  function ApplyPalette(strWk) {
    const dt = ParseDateKey(strWk);
    const nWeekNo = Math.floor(Math.round(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) / 86400000) / 7);
    const objP = g_arrPalettes[((nWeekNo % 7) + 7) % 7];
    const objStyle = document.body.style;
    objStyle.setProperty('--pa', objP.a); objStyle.setProperty('--pb', objP.b); objStyle.setProperty('--pacc', objP.acc);
    objStyle.setProperty('--pda', objP.da); objStyle.setProperty('--pdb', objP.db); objStyle.setProperty('--pdacc', objP.dacc);
  }

  function RenderHeader() {
    const strWk = g_objState.strWeek;
    ApplyPalette(strWk);
    const dtStart = ParseDateKey(strWk);
    const nNth = Math.ceil(dtStart.getDate() / 7);
    g_objEl.elTitle.textContent = `${dtStart.getMonth() + 1}월 ${nNth}주차`;
    const strEnd = WeekEnd(strWk);
    const strRange = `${DotDate(strWk)} – ${strEnd.slice(5).replace('-', '.')}`;
    const bCurrent = strWk === CurrentWeekKey();
    g_objEl.elSub.innerHTML = `${strRange} · ${bCurrent ? '이번 주' : '<em>이번 주로 이동</em>'}`;
    g_objEl.elDot.classList.toggle('on', !CanWrite());
  }

  /** 보기 방식에 따라 본문을 어절 단위로 가림 (공백·줄바꿈은 그대로 유지) */
  function RenderText(strText, strMode) {
    if (strMode === 'full') return Esc(strText).replace(/\n/g, '<br>');
    return strText.split(/(\s+)/).map((strTok) => {
      if (!strTok) return '';
      if (/^\s+$/.test(strTok)) return strTok.includes('\n') ? '<br>' : ' ';
      return `<span class="bl">${Esc(strTok)}</span>`;
    }).join('');
  }

  function RenderCard(objV) {
    const strMode = ModeOf(objV.id);
    const bFolded = !!g_objViewPref.objFold[objV.id];
    const bPeek = g_setPeek.has(objV.id);
    const strModes = g_arrModes.map(([strKey, strLabel]) => `<button type="button" class="mode${strMode === strKey ? ' on' : ''}" data-act="mode" data-mode="${strKey}" aria-pressed="${strMode === strKey}">${strLabel}</button>`).join('');
    return `<article class="vcard${bFolded ? ' folded' : ''}" data-id="${Esc(objV.id)}">
      <div class="vc-head">
        <button type="button" class="vc-title" data-act="fold">${Esc(objV.title || '제목 없음')}</button>
        <button type="button" class="vc-fold" data-act="fold" aria-label="${bFolded ? '펼치기' : '접기'}" aria-expanded="${!bFolded}">${g_strIconChevron}</button>
      </div>
      ${objV.ref ? `<p class="vc-ref">${Esc(objV.ref)}</p>` : ''}
      <div class="vc-body">
        <p class="vc-text${strMode !== 'full' ? ' masked' : ''}${bPeek ? ' peek' : ''}" data-act="peek">${RenderText(objV.text, strMode)}</p>
        ${strMode !== 'full' ? `<p class="vc-hint">본문을 누르면 ${bPeek ? '다시 가려요' : '잠시 보여요'}</p>` : ''}
        <div class="vc-modes">${strModes}</div>
        <div class="vc-foot">
          <button type="button" class="vc-edit" data-act="edit">편집</button>
        </div>
      </div>
    </article>`;
  }

  function RenderPane() {
    RenderHeader();
    const strWk = g_objState.strWeek;
    const objData = g_objStore.Data(strWk);
    g_objState.objView = objData ? Clone(objData) : NormalizeWeek(null, strWk);

    if (g_objState.bLoading && !g_objStore.Known(strWk)) {
      g_objEl.elPane.innerHTML = `<div class="swipe-hint" aria-hidden="true"><i></i><i class="on"></i><i></i></div><div class="skeleton"><span class="sk-line" style="width:55%"></span><span class="sk-line" style="width:30%"></span><span class="sk-line" style="height:22px"></span><span class="sk-line" style="height:22px;width:85%"></span></div>`;
      return;
    }

    const arrVerses = g_objState.objView.verses;
    const arrHtml = ['<div class="swipe-hint" aria-hidden="true"><i></i><i class="on"></i><i></i></div>'];
    if (g_objState.strError) arrHtml.push(`<div class="notice">${Esc(g_objState.strError)}<button class="btn sm" data-act="retry">다시 시도</button></div>`);
    if (arrVerses.length) {
      arrHtml.push(`<div class="cards">${arrVerses.map(RenderCard).join('')}</div>`);
      arrHtml.push(`<p class="week-stat num">이번 주 말씀 ${arrVerses.length}개</p>`);
    } else {
      arrHtml.push(`<div class="empty"><b>등록된 말씀이 없어요</b>${HasRepo() ? '아래에서 이 주의 말씀을 추가하세요.' : '오른쪽 위 연결 버튼에서 GitHub 저장소를 먼저 연결하세요.'}</div>`);
    }
    if (arrVerses.length < g_nMaxVerses) arrHtml.push(`<button class="add-row" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>말씀 추가</button>`);
    g_objEl.elPane.innerHTML = arrHtml.join('');
  }

  /* ================= 데이터 불러오기 ================= */
  let g_nLoadSeq = 0;
  async function Load(bForce) {
    const nSeq = ++g_nLoadSeq;
    const strWk = g_objState.strWeek;
    g_objState.strError = '';
    if (!HasRepo()) { g_objState.bLoading = false; RenderPane(); return; }
    g_objState.bLoading = true;
    if (!g_objStore.Known(strWk)) RenderPane();
    try {
      const bChanged = await g_objStore.Ensure(strWk, bForce);
      if (nSeq !== g_nLoadSeq) return;
      g_objState.bLoading = false;
      if (bChanged || !g_objEl.elPane.querySelector('.cards, .empty')) RenderPane();
    } catch (e) {
      console.error('주간 말씀 불러오기 실패', e);
      if (nSeq !== g_nLoadSeq) return;
      g_objState.bLoading = false;
      g_objState.strError = e.message;
      RenderPane();
    }
    // 옆 주 미리 읽기 (스와이프 시 바로 표시)
    if (nSeq === g_nLoadSeq) [AddWeek(strWk, -1), AddWeek(strWk, 1)].forEach((strAdj) => { if (!g_objStore.Known(strAdj)) g_objStore.Ensure(strAdj, false).catch(() => {}); });
  }

  /* ================= 변경 (낙관적 반영 후 커밋) ================= */
  function Commit(fnApply, strMessage) {
    const strWk = g_objState.strWeek;
    if (!CanWrite()) { Toast('먼저 GitHub를 연결해 주세요'); OpenSettings(); return Promise.resolve(false); }
    const objLocal = Clone(g_objState.objView);
    fnApply(objLocal);
    g_objStore.mapWeeks.set(strWk, { objData: NormalizeWeek(objLocal, strWk), strSha: (g_objStore.mapWeeks.get(strWk) || {}).strSha || null, nFetchedAt: 0 });
    if (g_objState.strWeek === strWk) RenderPane();
    return MutateWeek(strWk, fnApply, `주간 말씀 ${strWk} · ${strMessage}`).then(() => {
      if (g_objState.strWeek === strWk) RenderPane();
      return true;
    }).catch((e) => {
      console.error('저장 실패', e);
      SetSync('저장 실패', true);
      Toast(e.message);
      g_objStore.setFresh.delete(strWk);
      g_objStore.Ensure(strWk, true).then(() => { if (g_objState.strWeek === strWk) RenderPane(); }).catch(() => {});
      return false;
    });
  }

  /* ================= 시트 공통 ================= */
  let g_elOpenSheet = null;
  function OpenSheet(elSheet) {
    if (g_elOpenSheet) g_elOpenSheet.classList.remove('on');
    g_elOpenSheet = elSheet;
    g_objEl.elBackdrop.classList.add('on');
    elSheet.classList.add('on');
  }
  function CloseSheet() {
    if (!g_elOpenSheet) return;
    if (document.activeElement && g_elOpenSheet.contains(document.activeElement)) document.activeElement.blur();
    g_elOpenSheet.classList.remove('on');
    g_objEl.elBackdrop.classList.remove('on');
    g_elOpenSheet = null;
  }
  g_objEl.elBackdrop.addEventListener('click', CloseSheet);
  document.querySelectorAll('[data-close]').forEach((elBtn) => elBtn.addEventListener('click', CloseSheet));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { CloseSheet(); return; }
    if (g_elOpenSheet || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return;
    if (e.key === 'ArrowLeft') GoWeek(-1);
    if (e.key === 'ArrowRight') GoWeek(1);
  });

  /* ================= 말씀 편집 시트 ================= */
  const g_objVerseSheet = { elSheet: Q('#verseSheet'), strId: '', strDate: '' };

  function OpenVerse(strId) {
    const strWk = g_objState.strWeek;
    const objV = strId ? g_objState.objView.verses.find((x) => x.id === strId) : null;
    if (strId && !objV) return;
    g_objVerseSheet.strId = strId || '';
    const strToday = DateKeyOf(new Date());
    const strDefaultDate = WeekKeyOf(new Date()) === strWk ? strToday : strWk;
    Q('#vsTitle').textContent = objV ? '말씀 편집' : '새 말씀';
    Q('#vsName').value = objV ? objV.title : '';
    Q('#vsRef').value = objV ? objV.ref : '';
    Q('#vsText').value = objV ? objV.text : '';
    g_objVerseSheet.strDate = objV ? objV.date : strDefaultDate;   // 날짜 입력은 없애고 정렬용 값만 내부 유지
    Q('#vsTools').style.display = objV ? '' : 'none';
    OpenSheet(g_objVerseSheet.elSheet);
    if (!objV) setTimeout(() => Q('#vsName').focus(), 320);
  }

  Q('#vsSave').addEventListener('click', () => {
    const strWk = g_objState.strWeek;
    const strTitle = Q('#vsName').value.trim().slice(0, 60);
    const strRef = Q('#vsRef').value.trim().slice(0, 40);
    const strText = Q('#vsText').value.trim().slice(0, 3000);
    const strDate = IsDateKey(g_objVerseSheet.strDate) && WeekKeyOf(ParseDateKey(g_objVerseSheet.strDate)) === strWk ? g_objVerseSheet.strDate : strWk;
    if (!strText) { Toast('본문을 입력해 주세요'); Q('#vsText').focus(); return; }
    const objPatch = { title: strTitle, ref: strRef, text: strText, date: strDate };
    const strId = g_objVerseSheet.strId;
    const strLabel = strRef || strTitle || '말씀';
    CloseSheet();
    if (strId) {
      const objOld = g_objState.objView.verses.find((x) => x.id === strId);
      if (objOld && JSON.stringify({ ...objOld, ...objPatch }) === JSON.stringify(objOld)) return;
      Commit((objD) => { const objIt = objD.verses.find((x) => x.id === strId); if (objIt) Object.assign(objIt, objPatch); else objD.verses.push({ id: strId, ...objPatch }); }, `${strLabel} 수정`);
    } else {
      const strNewId = NewId();
      Commit((objD) => { objD.verses.push({ id: strNewId, ...objPatch }); }, `${strLabel} 추가`);
    }
  });

  Q('#vsDelete').addEventListener('click', () => {
    const strId = g_objVerseSheet.strId;
    const objV = g_objState.objView.verses.find((x) => x.id === strId);
    if (!objV || !confirm(`'${objV.ref || objV.title || '말씀'}'을(를) 이 주에서 삭제할까요?`)) return;
    CloseSheet();
    delete g_objViewPref.objFold[strId];
    delete g_objViewPref.objMode[strId];
    SaveViewPref();
    Commit((objD) => { objD.verses = objD.verses.filter((x) => x.id !== strId); }, `${objV.ref || objV.title || '말씀'} 삭제`);
  });

  /* ================= 설정 시트 ================= */
  function SetGhStatus(strMsg, bWarn) {
    const elS = Q('#ghStatus');
    elS.textContent = strMsg;
    elS.classList.toggle('warn', !!bWarn);
  }

  function OpenSettings() {
    Q('#ghOwner').value = g_objConfig.owner;
    Q('#ghRepo').value = g_objConfig.repo;
    Q('#ghBranch').value = g_objConfig.branch;
    Q('#ghPath').value = g_objConfig.path;
    Q('#ghToken').value = '';
    const objFrom = { own: '저장된 토큰 사용 중', verse: '오늘의 말씀 토큰 사용 중', ledger: '가계부 토큰 사용 중' };
    Q('#ghToken').placeholder = g_objConfig.token ? objFrom[g_objConfig.strTokenFrom] : 'github_pat_...';
    Q('#ghHelp').textContent = g_objConfig.strTokenFrom === 'verse' || g_objConfig.strTokenFrom === 'ledger'
      ? `같은 주소의 ${g_objConfig.strTokenFrom === 'verse' ? '오늘의 말씀' : '가계부'}에 저장된 토큰을 그대로 쓰고 있어요. 다른 토큰을 쓰려면 새로 입력하세요.`
      : 'Fine-grained 토큰에서 이 저장소를 선택하고 Contents 권한을 Read and write로 발급하세요. 토큰은 이 기기 브라우저에만 저장돼요.';
    if (!HasRepo()) SetGhStatus('저장소 정보를 입력하세요. github.io 주소로 접속하면 자동으로 채워져요.', true);
    else if (!g_objConfig.token) SetGhStatus('토큰이 없어 읽기 전용이에요. GitHub Pages에 배포된 내용을 보여줘요.', true);
    else SetGhStatus(`연결됨 · ${g_objConfig.owner}/${g_objConfig.repo} (${g_objConfig.branch}) · ${CleanPath(g_objConfig.path)}`, false);
    OpenSheet(Q('#settingsSheet'));
  }

  Q('#ghSave').addEventListener('click', async () => {
    const elBtn = Q('#ghSave');
    const strToken = Q('#ghToken').value.trim();
    g_objConfig.owner = Q('#ghOwner').value.trim();
    g_objConfig.repo = Q('#ghRepo').value.trim();
    g_objConfig.branch = Q('#ghBranch').value.trim() || 'main';
    g_objConfig.path = CleanPath(Q('#ghPath').value);
    if (strToken) { g_objConfig.token = strToken; g_objConfig.strTokenFrom = 'own'; }
    SaveConfig();
    if (g_objStore.strRepo !== RepoKey()) g_objStore.Reset();
    if (!HasRepo()) { SetGhStatus('소유자와 저장소를 입력하세요', true); return; }
    if (!g_objConfig.token) { SetGhStatus('토큰 없이 읽기 전용으로 저장했어요', true); RenderHeader(); Load(true); return; }
    elBtn.disabled = true;
    SetGhStatus('연결 확인 중…', false);
    try {
      const strRepoApi = `${g_strApi}/repos/${encodeURIComponent(g_objConfig.owner)}/${encodeURIComponent(g_objConfig.repo)}`;
      const objRepoRes = await Gh('GET', strRepoApi);
      if (!objRepoRes.ok) throw await ApiError(objRepoRes);
      const objRepo = await objRepoRes.json();
      if (objRepo.permissions && objRepo.permissions.push === false) throw new Error('토큰에 이 저장소의 쓰기 권한이 없어요');
      const objBrRes = await Gh('GET', `${strRepoApi}/branches/${encodeURIComponent(g_objConfig.branch)}`);
      if (!objBrRes.ok) throw await ApiError(objBrRes);
      SetGhStatus(`연결됨 · ${g_objConfig.owner}/${g_objConfig.repo} (${g_objConfig.branch}) · ${CleanPath(g_objConfig.path)}`, false);
      Toast('GitHub에 연결했어요');
      g_objStore.setFresh.clear();
      RenderHeader();
      Load(true);
    } catch (e) {
      console.error('연결 확인 실패', e);
      SetGhStatus(e.message, true);
    } finally {
      elBtn.disabled = false;
    }
  });

  Q('#ghClear').addEventListener('click', () => {
    if (!g_objConfig.token) return;
    if (g_objConfig.strTokenFrom !== 'own') { Toast(`${g_objConfig.strTokenFrom === 'verse' ? '오늘의 말씀' : '가계부'}의 토큰이에요. 그 앱에서 지워 주세요`); return; }
    if (!confirm('이 기기에서 주간 말씀 토큰을 지울까요?\nGitHub에 저장된 말씀은 그대로 남아요.')) return;
    g_objConfig.token = '';
    g_objConfig.strTokenFrom = '';
    SaveConfig();
    LoadConfig();
    g_objStore.setFresh.clear();
    OpenSettings();
    RenderHeader();
    Load(true);
  });

  /* ================= 화면 이벤트 ================= */
  let g_bSuppressClick = false;
  g_objEl.elPane.addEventListener('click', (e) => {
    if (g_bSuppressClick) return;
    const elAct = e.target.closest('[data-act]');
    if (!elAct) return;
    const strAct = elAct.dataset.act;
    if (strAct === 'add') { OpenVerse(''); return; }
    if (strAct === 'retry') { Load(true); return; }
    const elCard = elAct.closest('.vcard');
    if (!elCard) return;
    const strId = elCard.dataset.id;
    const objV = g_objState.objView.verses.find((x) => x.id === strId);
    if (!objV) return;
    if (strAct === 'fold') {
      if (g_objViewPref.objFold[strId]) delete g_objViewPref.objFold[strId]; else g_objViewPref.objFold[strId] = 1;
      SaveViewPref();
      RenderPane();
    } else if (strAct === 'mode') {
      if (elAct.dataset.mode === 'full') delete g_objViewPref.objMode[strId]; else g_objViewPref.objMode[strId] = elAct.dataset.mode;
      g_setPeek.delete(strId);
      SaveViewPref();
      RenderPane();
    } else if (strAct === 'peek') {
      if (ModeOf(strId) === 'full') return;
      if (g_setPeek.has(strId)) g_setPeek.delete(strId); else g_setPeek.add(strId);
      RenderPane();
    } else if (strAct === 'edit') {
      OpenVerse(strId);
    }
  });
  Q('#btnSettings').addEventListener('click', OpenSettings);
  Q('#btnFontDown').addEventListener('click', () => ChangeFontSize(-g_nFontStep));
  Q('#btnFontUp').addEventListener('click', () => ChangeFontSize(g_nFontStep));
  Q('#btnPrev').addEventListener('click', () => GoWeek(-1));
  Q('#btnNext').addEventListener('click', () => GoWeek(1));
  Q('#btnToday').addEventListener('click', () => { const strNow = CurrentWeekKey(); if (strNow !== g_objState.strWeek) GoWeek(strNow > g_objState.strWeek ? 1 : -1, strNow); });

  /* ================= 스와이프 주 이동 ================= */
  let g_bAnimating = false;
  const SetPaneX = (nX, bAnim) => { g_objEl.elPane.classList.toggle('anim', !!bAnim); g_objEl.elPane.style.transform = nX ? `translate3d(${nX}px,0,0)` : ''; };

  function GoWeek(nDir, strTarget) {
    if (g_bAnimating) return;
    g_bAnimating = true;
    const nW = g_objEl.elViewport.clientWidth || 360;
    SetPaneX(-nDir * nW, true);
    g_objEl.elPane.style.opacity = '0.2';
    setTimeout(() => {
      g_objState.strWeek = strTarget || AddWeek(g_objState.strWeek, nDir);
      g_objState.strError = '';
      g_objState.bLoading = HasRepo() && !g_objStore.Known(g_objState.strWeek);
      g_setPeek.clear();
      RenderPane();
      SetPaneX(nDir * nW, false);
      void g_objEl.elPane.offsetWidth;
      SetPaneX(0, true);
      g_objEl.elPane.style.opacity = '';
      window.scrollTo({ top: 0, behavior: 'auto' });
      setTimeout(() => { g_bAnimating = false; g_objEl.elPane.classList.remove('anim'); }, 250);
      Load(false);
    }, 200);
  }

  (() => {
    let objDrag = null;
    const elV = g_objEl.elViewport;
    elV.addEventListener('pointerdown', (e) => {
      if (g_bAnimating || (e.pointerType === 'mouse' && e.button !== 0)) return;
      objDrag = { nX: e.clientX, nY: e.clientY, nT: performance.now(), strAxis: '', nDx: 0, nId: e.pointerId };
    });
    elV.addEventListener('pointermove', (e) => {
      if (!objDrag || e.pointerId !== objDrag.nId) return;
      const nDx = e.clientX - objDrag.nX;
      const nDy = e.clientY - objDrag.nY;
      if (!objDrag.strAxis) {
        if (Math.abs(nDx) < 8 && Math.abs(nDy) < 8) return;
        objDrag.strAxis = Math.abs(nDx) > Math.abs(nDy) * 1.2 ? 'x' : 'y';
        if (objDrag.strAxis === 'x') { try { elV.setPointerCapture(e.pointerId); } catch { /* 무시 */ } }
      }
      if (objDrag.strAxis !== 'x') return;
      objDrag.nDx = nDx;
      SetPaneX(nDx * 0.92, false);
      g_objEl.elPane.style.opacity = String(1 - Math.min(Math.abs(nDx) / (elV.clientWidth * 1.6), 0.5));
    });
    const fnEnd = (e) => {
      if (!objDrag || e.pointerId !== objDrag.nId) return;
      const objD = objDrag;
      objDrag = null;
      if (objD.strAxis !== 'x') return;
      g_bSuppressClick = true;
      setTimeout(() => { g_bSuppressClick = false; }, 300);
      const nVel = Math.abs(objD.nDx) / Math.max(performance.now() - objD.nT, 1);
      if (e.type !== 'pointercancel' && (Math.abs(objD.nDx) > elV.clientWidth * 0.22 || (nVel > 0.45 && Math.abs(objD.nDx) > 30))) { GoWeek(objD.nDx < 0 ? 1 : -1); return; }
      SetPaneX(0, true);
      g_objEl.elPane.style.opacity = '';
    };
    elV.addEventListener('pointerup', fnEnd);
    elV.addEventListener('pointercancel', fnEnd);
  })();

  /* ================= 시작 ================= */
  ApplyFontSize();
  LoadConfig();
  g_objStore.Hydrate();
  g_objState.bLoading = HasRepo() && !g_objStore.Known(g_objState.strWeek);
  RenderPane();
  Load(false);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !g_nPending) Load(false); });
  window.addEventListener('storage', (e) => { if ([g_objKeys.strConfig, g_objKeys.strShared, g_objKeys.strLedger].includes(e.key)) { LoadConfig(); RenderHeader(); } });
})();
</script>
</body>
</html>
